<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mucho éxito Amorchi </title>
    <style>
               body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9f43 0%, #ff6b6b 100%);
            color: white;

            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden; /* Evita que la pantalla se mueva de lado con los corazones */
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10; /* Hace que la tarjeta quede por encima de los corazones */
        }
        h1 { font-size: 2.2em; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; }
        
     /* Zona de la foto dinámica adaptable */
        .contenedor-foto {
            margin: 20px auto;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .foto-dinamica {
            max-width: 100%;       /* Evita que las fotos anchas se salgan de la tarjeta */
            max-height: 350px;     /* Altura máxima ideal para que mantenga su proporción original */
            width: auto;           /* Adapta el ancho real de la imagen original */
            height: auto;          /* Adapta el alto real de la imagen original */
            border-radius: 12px;   /* Un borde ligeramente redondeado muy elegante en lugar del círculo */
            border: 4px solid #ff4757;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        
        /* Contador y Botón interactivo */
        .contador-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-abrazo {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            margin-bottom: 25px;
            transition: 0.2s;
        }
        .btn-abrazo:active {
            transform: scale(0.95);
        }

        /* Botón para ir a la otra página */
        .btn-siguiente {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .btn-siguiente:hover {
            background: #ff6b81;
        }

        /* Efecto de corazones flotantes */
        .corazon-flotante {
            position: fixed;
            bottom: -50px; /* Inician desde abajo de la pantalla */
            color: #ff4757;
            font-size: 24px;
            pointer-events: none;
            z-index: 1;
            animation: flotarVertical 1.5s ease-out forwards;
        }

        @keyframes flotarVertical {
            0% {
                transform: translateY(0) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1> Hoy vas a brillar (más) 💗
 </h1>
        <p>Sé lo mucho que te has preparado. Eres la persona más capaz del mundo y aquí estoy para apoyarte, siempre.</p>
        
        <!-- Aquí aparece tu foto que irá cambiando -->
        <div class="contenedor-foto">
            <img id="miFoto" src="us.jpeg" alt="" class="foto-dinamica">
        </div>

        <!-- Contador digital -->
        <div class="contador-box">
            Abrazos y besos que te daré cuando vengas a Monclova: <span id="numeroAbrazos">0</span>
        </div>
        <br>
        
        <!-- Botón interactivo -->
        <button class="btn-abrazo" onclick="darAbrazo()"> Presiona si quieres 1 abrazo ❤️</button>
        
        <p style="font-size: 0.9em; opacity: 0.8;">¿Quieres ver más cosas cursis?</p>
        <a href="fotos.html" class="btn-siguiente">Sisi alv, a ver 📸</a>
    </div>

    <script>
        let contador = 0;
        
        const misFotos = [
            "dani1.jpeg", // Tu foto 1
            "dani2.jpeg", // Tu foto 2
            "dani3.jpeg", // Tu foto 3
            "dani4.jpeg", // Tu foto 4
            "dani5.jpeg", // Tu foto 5
            "dani7.jpeg",
            "dani8.jpeg",
            "dani9.jpeg",
            "dani10.jpeg"
                
        ];

        let fotoActualIndex = 0;

        function darAbrazo() {
            // 1. Sumar 1 al contador
            contador++;
            document.getElementById("numeroAbrazos").innerText = contador;
            
            // 2. Cambiar a la siguiente foto de la lista
            fotoActualIndex = (fotoActualIndex + 1) % misFotos.length;
            const elementoFoto = document.getElementById("miFoto");
            elementoFoto.src = misFotos[fotoActualIndex];
            
            // 3. Efecto visual de brinco en la foto
            elementoFoto.style.transform = "scale(1.1)";
            setTimeout(() => {
                elementoFoto.style.transform = "scale(1)";
            }, 150);

            // 4. ¡LLUVIA DE CORAZONES!
            for (let i = 0; i < 15; i++) {
                crearCorazon();
            }
        }

        function crearCorazon() {
            const corazon = document.createElement("div");
            corazon.classList.add("corazon-flotante");
            
            const modelos = ["❤️", "💖", "💋", "💘", "💝"];
            corazon.innerText = modelos[Math.floor(Math.random() * modelos.length)];
            
            corazon.style.left = Math.random() * 100 + "vw";
            
            const tamaño = Math.random() * 20 + 20;
            corazon.style.fontSize = tamaño + "px";
            corazon.style.animationDuration = (Math.random() * 1 + 1) + "s";
            
            document.body.appendChild(corazon);
            
            setTimeout(() => {
                corazon.remove();
            }, 2000);
        }
    </script> <!-- ¡Etiqueta de cierre corregida aquí! -->

</body>
</html>
